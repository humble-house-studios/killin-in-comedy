[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="games/*/data/*.json"
exclude_filter="addons/gut/*, tests/*, .gutconfig.json, games/*/docs/*, games/*/autoloads.txt"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell=""
html/head_include="<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
<style>
html,body{position:fixed;left:0;top:0;width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#000;overscroll-behavior:none}
#canvas{position:fixed;left:0;top:0}
</style>
<script>
(function(){
/* Edge to edge on iPhone: the home-screen app otherwise keeps the portrait
   status-bar gap after you turn it sideways, pushing the game down and cutting
   off the bottom. The game keeps clear of the notch itself (scenes/safe_area.gd). */
var vp='width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover';
var m=document.querySelector('meta[name=viewport]');
if(m){m.setAttribute('content',vp);}else{m=document.createElement('meta');m.name='viewport';m.content=vp;document.head.appendChild(m);}
/* Safe-area insets in screen pixels: top,right,bottom,left. */
var probe=document.createElement('div');
probe.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
window.kicSafeInsets=function(){
if(!probe.parentNode&&document.body){document.body.appendChild(probe);}
var s=getComputedStyle(probe),d=window.devicePixelRatio||1;
return [s.paddingTop,s.paddingRight,s.paddingBottom,s.paddingLeft].map(function(v){return Math.round((parseFloat(v)||0)*d);}).join(',');
};
/* iOS reports the new window size late after a turn: nudge the game a few times. */
function nudge(){window.scrollTo(0,0);window.dispatchEvent(new Event('resize'));}
window.addEventListener('orientationchange',function(){[50,250,600,1200].forEach(function(t){setTimeout(nudge,t);});});
/* Sound: play through the speakers and AirPlay even with the silent switch on. */
function playback(){try{if(navigator.audioSession){navigator.audioSession.type='playback';}}catch(e){}}
playback();
['touchend','pointerup','click','keydown'].forEach(function(n){document.addEventListener(n,playback,true);});
document.addEventListener('visibilitychange',playback);
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
