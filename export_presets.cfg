html/head_include="<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
<style>
html,body{position:fixed;left:0;top:0;width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#000;overscroll-behavior:none}
#canvas{position:fixed;left:0;top:0}
</style>
<script>
(function(){
/* Edge to edge on iPhone: the home-screen app otherwise keeps the portrait
   status-bar gap after you turn it sideways, pushing the game down and cutting
   off the bottom. The game keeps clear of the notch itself (scenes/safe_area.gd). */
var vp='width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover';
var m=document.querySelector('meta[name=viewport]');
if(m){m.setAttribute('content',vp);}else{m=document.createElement('meta');m.name='viewport';m.content=vp;document.head.appendChild(m);}
/* Safe-area insets in screen pixels: top,right,bottom,left. */
var probe=document.createElement('div');
probe.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
window.kicSafeInsets=function(){
if(!probe.parentNode&&document.body){document.body.appendChild(probe);}
var s=getComputedStyle(probe),d=window.devicePixelRatio||1;
return [s.paddingTop,s.paddingRight,s.paddingBottom,s.paddingLeft].map(function(v){return Math.round((parseFloat(v)||0)*d);}).join(',');
};
/* iOS reports the new window size late after a turn: nudge the game a few times. */
function nudge(){window.scrollTo(0,0);window.dispatchEvent(new Event('resize'));}
window.addEventListener('orientationchange',function(){[50,250,600,1200].forEach(function(t){setTimeout(nudge,t);});});
/* Sound: play through the speakers and AirPlay even with the silent switch on. */
var ctxs=[];
var AC=window.AudioContext||window.webkitAudioContext;
if(AC){
var KicAC=function(o){var c=o?new AC(o):new AC();ctxs.push(c);return c;};
KicAC.prototype=AC.prototype;
window.AudioContext=KicAC;
if(window.webkitAudioContext){window.webkitAudioContext=KicAC;}
}
/* Cast mode (open the page with ?cast=1): send the game's sound through a media element,
   which iOS routes to AirPlay more reliably than raw Web Audio. */
var casts=[];
if(/[?&]cast=1/.test(location.search)&&window.AudioNode&&window.AudioDestinationNode){
var oc=AudioNode.prototype.connect;
var sinks=new WeakMap();
AudioNode.prototype.connect=function(d){
try{
if(d instanceof AudioDestinationNode){
var c=d.context,sk=sinks.get(c);
if(!sk){
sk=c.createMediaStreamDestination();sinks.set(c,sk);
var el=new Audio();el.srcObject=sk.stream;el.setAttribute('playsinline','');
casts.push(el);
var pr=el.play();if(pr&&pr.catch){pr.catch(function(){});}
}
arguments[0]=sk;
}
}catch(e){}
return oc.apply(this,arguments);
};
}
/* A silent looping clip makes iOS treat the page as media playback, so sound follows AirPlay. */
var hush=new Audio('data:audio/wav;base64,');
hush.loop=true;hush.volume=0.01;hush.setAttribute('playsinline','');
/* The mic (Dale's HOLD TO TALK) needs play-and-record while it's open;
   playback-only would block it. Back to playback once it's closed. */
var micOn=0;
if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
var gum=navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
navigator.mediaDevices.getUserMedia=function(c){
if(c&&c.audio){micOn++;try{if(navigator.audioSession){navigator.audioSession.type='play-and-record';}}catch(e){}}
var p=gum(c);
if(c&&c.audio){p.then(function(st){st.getAudioTracks().forEach(function(t){
var done=false,off=function(){if(!done){done=true;micOn=Math.max(0,micOn-1);}};
var os=t.stop.bind(t);t.stop=function(){off();os();};t.addEventListener('ended',off);});},function(){micOn=Math.max(0,micOn-1);});}
return p;};
}
function wake(){
try{if(navigator.audioSession){navigator.audioSession.type=micOn?'play-and-record':'playback';}}catch(e){}
try{if(hush.paused){var r=hush.play();if(r&&r.catch){r.catch(function(){});}}}catch(e){}
casts.forEach(function(e){try{if(e.paused){var q=e.play();if(q&&q.catch){q.catch(function(){});}}}catch(x){}});
ctxs.forEach(function(c){try{if(c.state!=='running'){c.resume();}}catch(e){}});
}
wake();
['touchstart','touchend','pointerup','click','keydown'].forEach(function(n){document.addEventListener(n,wake,true);});
document.addEventListener('visibilitychange',wake);
setInterval(wake,2000);
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
