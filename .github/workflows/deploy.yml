# Every push to main: Godot exports a web build in the cloud and publishes it
# to GitHub Pages, so the newest version is always one tap away on your phone.
name: Build and deploy to phone

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  # Dale's voice server (voice/): a free Cloudflare Worker that hears you, answers
  # as Dale and talks back. Deployed only when the repo has the
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets; its address goes into
  # the office build so the TALK button knows where to call. Without them (or if
  # this fails) the game still builds, just without voice chat.
  voice:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy Dale's voice server
        id: deploy
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Dale voice::No Cloudflare secrets yet, skipping voice chat."
            exit 0
          fi
          # Accept a pasted dashboard address too: keep just the 32-character ID.
          id=$(echo "$CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-f]{32}' | head -1)
          [ -n "$id" ] && export CLOUDFLARE_ACCOUNT_ID="$id"
          # Workers need a free workers.dev subdomain on the account; claim one
          # the first time if there isn't one yet.
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          have=$(curl -s -H "$auth" "$api" | python3 -c "import sys,json; print((json.load(sys.stdin).get('result') or {}).get('subdomain') or '')" 2>/dev/null)
          if [ -z "$have" ]; then
            for name in humble-house humble-house-studios "humble-${CLOUDFLARE_ACCOUNT_ID:0:6}"; do
              out=$(curl -s -X PUT -H "$auth" -H 'Content-Type: application/json' -d "{\"subdomain\":\"$name\"}" "$api")
              echo "$out" | grep -q '"success":true' && { echo "::notice title=Dale voice::Claimed $name.workers.dev"; break; }
              echo "::warning title=Dale voice subdomain::$name: $(echo "$out" | head -c 300)"
            done
          fi
          cd voice
          set +e
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ $code -ne 0 ] || [ -z "$url" ]; then
            grep -iE "error|✘" deploy.log | head -8 | while IFS= read -r line; do echo "::error title=Dale voice deploy::${line}"; done
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Dale voice::Live at $url"
          # Smoke test: one typed line through the whole chain.
          for i in 1 2 3; do
            reply=$(curl -s -m 60 -X POST "$url/talk" -H 'Content-Type: application/json' \
              -d '{"text":"Hi Dale, how is your day going?"}')
            [ -n "$reply" ] && break
            sleep 5
          done
          echo "$reply" | python3 -c "import sys,json; d=json.load(sys.stdin); print('::notice title=Dale says::' + d.get('reply', d.get('error','?'))[:200]); print('::notice title=Dale models::' + json.dumps(d.get('models',{}))[:900]); print('::notice title=Dale audio::%d base64 chars' % len(d.get('audio','')))" || echo "::warning title=Dale voice::Smoke test failed: ${reply:0:300}"

      # Dale's story lines, pre-recorded in his voice so the game plays them
      # like any other sound. Cached: only new or changed lines get recorded.
      - uses: actions/cache@v4
        if: steps.deploy.outputs.url != ''
        with:
          path: audio/dale
          key: dale-lines-${{ hashFiles('data/dale_lines.gd', 'voice/src/index.js') }}
          restore-keys: dale-lines-
      - name: Record Dale's lines
        if: steps.deploy.outputs.url != ''
        continue-on-error: true
        run: |
          node tools/dale_voice_lines.mjs "${{ steps.deploy.outputs.url }}" | tee lines.log
          echo "::notice title=Dale lines::$(tail -1 lines.log)"
      - uses: actions/upload-artifact@v4
        if: steps.deploy.outputs.url != ''
        continue-on-error: true
        with:
          name: dale-lines
          path: audio/dale
          if-no-files-found: ignore
          retention-days: 3

  build:
    needs: voice
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      # Dale's pre-recorded lines from the voice job (if it made any).
      - uses: actions/download-artifact@v4
        if: needs.voice.outputs.url != ''
        continue-on-error: true
        with:
          name: dale-lines
          path: audio/dale

      - name: Install export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: godot --headless --import || true

      # Engine tests (GUT). A failing test stops the build, so a broken
      # engine never reaches the play link.
      - name: Run engine tests
        shell: bash
        run: |
          set +e
          godot --headless -s addons/gut/gut_cmdln.gd 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          sed 's/\x1b\[[0-9;]*m//g' test.log | grep -E "\[Failed\]|SCRIPT ERROR|Parse Error" | head -20 | while IFS= read -r line; do
            echo "::error title=Engine test::${line}"
          done
          exit $code

      - name: Export web build
        shell: bash
        run: |
          mkdir -v -p build/web
          set +e
          godot --headless --export-release "Web" build/web/index.html 2>&1 | tee export.log
          code=${PIPESTATUS[0]}
          # Surface Godot's errors as annotations so they show up without opening the raw log.
          { grep -iE "error|failed|cannot|invalid" export.log || true; } | head -20 | while IFS= read -r line; do
            echo "::warning title=Godot export::${line}"
          done
          echo "::notice title=Build output::exit=${code}; files: $(ls build/web 2>&1 | tr '\n' ' ')"
          if [ ! -f build/web/index.html ]; then
            tail -15 export.log | while IFS= read -r line; do echo "::error title=Godot log tail::${line}"; done
            exit 1
          fi

      # Second build: the 3D office where you play the game on a computer
      # monitor, published at /office/. Same project, different main scene.
      - name: Export office build
        shell: bash
        env:
          VOICE_URL: ${{ needs.voice.outputs.url }}
        run: |
          # Point Dale's TALK button at his voice server, if it's deployed.
          if [ -n "$VOICE_URL" ]; then
            sed -i "s#^const URL := \"\"#const URL := \"$VOICE_URL\"#" data/voice_server.gd
            grep -n "const URL" data/voice_server.gd
          fi
          # The office's other computers run other games (Phone Pong, Proof
          # Hand) and need their autoloads; fetch them only for this build so
          # the main game stays small.
          command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq git)
          tools/fetch_games.sh --autoloads
          godot --headless --import >/dev/null 2>&1 || true
          sed -i 's#run/main_scene="res://scenes/main.tscn"#run/main_scene="res://scenes/office/office.tscn"#' project.godot
          mkdir -v -p build/web/office
          godot --headless --export-release "Web" build/web/office/index.html 2>&1 | tail -5
          git checkout project.godot 2>/dev/null || sed -i 's#run/main_scene="res://scenes/office/office.tscn"#run/main_scene="res://scenes/main.tscn"#' project.godot
          if [ ! -f build/web/office/index.html ]; then
            echo "::error title=Office export::no build/web/office/index.html"
            exit 1
          fi

      - name: Add sound test page
        run: cp tools/beep.html build/web/beep.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
